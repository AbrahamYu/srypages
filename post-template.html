<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/img/icon/favicon.svg" type="image/x-icon" />
    <title><!-- PAGE_TITLE --></title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- ADSENSE -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5988270223050126" crossorigin="anonymous"></script>
    
    <!-- HIGHLIGHT.JS -->
    <link rel="stylesheet" href="/library/highlight_default.min.css" />
    <script src="/library/highlight_highlight.min.js"></script>
    <link rel="stylesheet" href="/library/highlight_ally-light.min.css" />
    
    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="/style/style.css" />
    
    <!-- TAILWIND -->
    <script src="/library/tailwind-3.4.1.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              primary: "#ffffff",
              background: "#000000",
              surface: "#09090b",
              graylv1: "#18181b",
              graylv2: "#27272a",
              graylv3: "#52525b",
              graylv4: "#a1a1aa",
              error: "#ef4444",
              lowError: "#f59e0b",
              activation: "#27272a",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #000000;
        font-family: 'Inter', sans-serif;
        letter-spacing: -0.02em;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000000;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 3px;
      }
    </style>
</head>
<body class="font-sans w-full text-zinc-300 min-h-screen selection:bg-white selection:text-black">
    <header class="sticky top-0 z-50 backdrop-blur-md bg-black/85 border-b border-zinc-900">
        <nav class="container max-w-[1000px] mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer">
                <a href="/index.html" class="text-sm font-bold tracking-tight text-white hover:text-zinc-300 transition-colors">
                    <!-- BLOG_TITLE -->
                </a>
            </div>
            <div id="menu" class="flex items-center gap-1">
                <!-- MENU_PLACEHOLDER -->
            </div>
        </nav>
    </header>

    <main class="container p-6 w-full mx-auto max-w-[720px] md:py-16">
        <div id="contents" class="bg-black border border-zinc-900 p-8 md:p-12 rounded-xl">
            <!-- POST_CONTENT_PLACEHOLDER -->
        </div>
    </main>

    <footer class="bg-black border-t border-zinc-900 py-10 text-center text-zinc-650 text-[11px] font-mono">
        <div class="container max-w-[1000px] mx-auto px-6 space-y-1.5">
            <p>&copy; 2026 Abraham Yoo. All rights reserved.</p>
            <p class="text-zinc-500">Powered by Vanilla JS, Tailwind CSS, Vercel Serverless.</p>
        </div>
    </footer>

    <!-- MOBILE MENU TOGGLE -->
    <script src="/js/mobileMenuToggle.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightBlock(block);
            });
        });
    </script>
</body>
</html>
